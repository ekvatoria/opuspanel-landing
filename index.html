<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpusPanel — Over Powered Engineering</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-index: border-box;
        }
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo-wrapper {
            position: relative;
            display: inline-block;
            animation: pulse 4s infinite ease-in-out;
        }
        .logo {
            width: 480px;
            height: auto;
            border-radius: 16px;
            display: block;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 1.5rem;
            letter-spacing: -0.05em;
            color: #f4f4f5;
        }
        p {
            font-family: "Courier New", Courier, monospace;
            font-size: 0.55rem;
            font-weight: 600;
            color: #bc9aff; /* Elektrik moru tınısı */
            margin-top: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .badge {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 0.5rem 1rem;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            font-size: 0.8rem;
            color: #a1a1aa;
        }
        .actions {
            margin-top: 1.25rem;
        }
        .demo-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.65rem 1.35rem;
            background: linear-gradient(180deg, #18181b 0%, #121215 100%);
            border: 1px solid rgba(188, 154, 255, 0.3);
            border-radius: 9999px;
            color: #f4f4f5;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(188, 154, 255, 0.12);
            transition: all 0.25s ease;
        }
        .demo-btn:hover {
            border-color: #bc9aff;
            background: rgba(188, 154, 255, 0.1);
            box-shadow: 0 0 30px rgba(188, 154, 255, 0.3);
            transform: translateY(-2px);
            color: #ffffff;
        }
        .demo-btn svg {
            color: #bc9aff;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(188, 154, 255, 0)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(188, 154, 255, 0.3)); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.png" alt="OpusPanel Logo" class="logo">
        </div>
        <h1>OpusPanel</h1>
        <p>Over Powered Engıneerıng</p>
        
        <div class="badge">
            ⚡ Deployment Initialized — Coming Soon
        </div>

        <div class="actions">
            <a href="/demovideo" class="demo-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Demo Videosunu İzle
            </a>
        </div>
    </div>

</body>
</html>
